<section class="page-head"><h1>Pesan Online</h1><p>Isi data pesanan, lalu pesanan akan tercatat otomatis.</p></section>
<div class="form-wrap"><form class="form-box" onsubmit="submitOrder(event)"><h2 style="margin-bottom:20px">Form Pesanan</h2><div class="form-grid">
<div><label>Nama Customer</label><input name="nama" required placeholder="Masukkan nama"></div>
<div><label>Nomor WhatsApp</label><input name="whatsapp" required placeholder="08xxxxxxxxxx"></div>
<div><label>Produk</label><select name="produk"><option>Banner</option><option>Stiker Custom</option><option>Brosur</option><option>Kartu Nama</option><option>Poster</option></select></div>
<div><label>Jumlah</label><input name="jumlah" type="number" min="1" value="1" required></div>
<div><label>Total Harga</label><input name="total" type="number" required placeholder="Contoh: 50000"></div>
<div><label>Status Pembayaran</label><select name="pembayaran"><option>Belum Dibayar</option><option>Sudah Dibayar</option></select></div>
<div class="full"><label>Catatan Pesanan</label><textarea name="catatan" placeholder="Contoh ukuran, bahan, dan detail desain"></textarea></div>
</div><button class="btn" style="margin-top:20px" type="submit">Kirim Pesanan</button><div id="orderResult" class="notice"></div></form></div>
